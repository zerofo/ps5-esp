<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ps5-AIO ESP 一键烧录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 24px; margin-top: 0; margin-bottom: 6px; }
    .hint { color: #666; font-size: 14px; margin-top: 0; }
    .build-info {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 10px;
      line-height: 1.6;
      word-break: break-all;
    }
    .build-info .sha {
      color: #667eea; font-weight: 600;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .build-info .msg { color: #64748b; }
    .warning {
      background: #fff8e1;
      border-left: 4px solid #f0ad4e;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      color: #8a6d3b;
      line-height: 1.6;
    }
    .warning code {
      background: rgba(0,0,0,0.06);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 13px;
    }
    .flash-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      margin: 16px 0;
    }
    .flash-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(102,126,234,0.4);
    }
    .flash-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    .status-panel { margin-top: 24px; }
    #steps { list-style: none; padding: 0; margin: 0 0 16px 0; }
    .step {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 15px;
      transition: background 0.2s;
    }
    .step .icon {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      margin-right: 12px; font-weight: bold; flex-shrink: 0;
    }
    .step .label { flex: 1; }
    .step .detail { color: #888; font-size: 13px; margin-left: 8px; }

    .step.pending { color: #aaa; }
    .step.pending .icon { color: #ccc; }
    .step.active { background: #eef2ff; color: #4c51bf; font-weight: 600; }
    .step.done { color: #38a169; }
    .step.done .icon { color: #38a169; }
    .step.error { background: #fef2f2; color: #e53e3e; }
    .step.error .icon { color: #e53e3e; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #c7d2fe; border-top-color: #4c51bf;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-bar {
      width: 100%; height: 12px;
      background: #e2e8f0; border-radius: 6px;
      overflow: hidden; margin: 8px 0;
    }
    #progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 6px;
      transition: width 0.15s ease-out;
    }
    #progress-text {
      text-align: center; font-size: 13px; color: #666;
      margin-bottom: 12px; font-variant-numeric: tabular-nums;
    }
    .success {
      background: #f0fff4; border: 1px solid #9ae6b4; color: #276749;
      padding: 14px 16px; border-radius: 8px; margin-top: 12px;
    }
    .error {
      background: #fff5f5; border: 1px solid #feb2b2; color: #c53030;
      padding: 14px 16px; border-radius: 8px; margin-top: 12px;
      word-break: break-word;
    }

    /* ===== 支持芯片列表 ===== */
    .chip-list { display: flex; flex-direction: column; gap: 6px; }
    .chip-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: #f8fafc;
      border: 1px solid #e2e8f0; border-radius: 8px;
    }
    .chip-name { font-weight: 600; color: #4c51bf; font-size: 15px; }
    .chip-flash { display: flex; gap: 6px; }
    .tag {
      padding: 2px 10px; background: #eef2ff; color: #4c51bf;
      border-radius: 12px; font-size: 12px; font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* ===== 8266 选择弹窗 ===== */
    #modal-8266 {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 1000;
      align-items: center; justify-content: center;
    }
    #modal-8266 .box {
      background: #fff; padding: 24px; border-radius: 12px;
      max-width: 360px; width: 90%;
      box-shadow: 0 4px 24px rgba(0,0,0,.2);
    }
    #modal-8266 h3 { margin: 0 0 8px; font-size: 18px; }
    #modal-8266 p  { margin: 0 0 16px; color: #666; font-size: 14px; }
    #modal-8266 button {
      width: 100%; padding: 12px; margin-bottom: 8px;
      font-size: 15px; border: 1px solid #e2e8f0;
      border-radius: 8px; background: #f8fafc; cursor: pointer;
    }
    #modal-8266 button:hover { background: #eef2ff; border-color: #c7d2fe; }
    #modal-8266 button.cancel {
      border: none; background: none;
      color: #94a3b8; font-size: 13px; padding: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ps5-AIO ESP 一键烧录</h1>
    <div id="build-info" class="build-info">版本加载中…</div>
    <p class="hint">自动识别芯片型号（emmm 8266也行吧）与 Flash 大小，加载对应固件并烧录到 <code>0x0</code>。</p>
    <p class="warning">
      ⚠️ 烧录前将<b>全片擦除</b> Flash，设备上原有数据将被清除。<br>
      若设备 Flash 较大（如 32MB）但无精确档位固件，会自动降档使用较小 Flash 的固件（32→16→8→4MB）。可用容量会受限，但功能正常；<b>小 Flash 设备不会刷入大固件</b>。
    </p>

    <button id="flash-btn" class="flash-btn">🔌 一键烧录</button>

    <h2 style="font-size:18px;margin:28px 0 12px;">🎯 支持的芯片型号</h2>
    <div id="chip-list">加载中…</div>

    <div id="status-panel" class="status-panel" style="display:none;">
      <ol id="steps"></ol>
      <div id="progress-wrap" style="display:none;">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="progress-text">0%</div>
      </div>
      <div id="result"></div>
    </div>
  </div>

  <div id="modal-8266">
    <div class="box">
      <h3>选择固件版本</h3>
      <p>检测到 ESP8266 芯片，请选择要烧录的版本：</p>
      <button id="btn-8266-normal">8266（标准版）</button>
      <button id="btn-8266-sd">8266sd（SD 卡版）</button>
      <button id="btn-8266-cancel" class="cancel">取消</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/web-serial-polyfill@latest/dist/web-serial-polyfill.umd.min.js"></script>
  <script type="module">
    import { ESPLoader, Transport } from 'https://cdn.jsdelivr.net/npm/esptool-js@0.7.0/bundle.js';

    const flashBtn    = document.getElementById('flash-btn');
    const statusPanel = document.getElementById('status-panel');
    const stepsEl     = document.getElementById('steps');
    const progressWrap= document.getElementById('progress-wrap');
    const progressFill= document.getElementById('progress-fill');
    const progressText= document.getElementById('progress-text');
    const resultEl    = document.getElementById('result');

    // ===== 版本信息 =====
    (function renderBuildInfo() {
      const el = document.getElementById('build-info');
      const b = window.BUILD_INFO;
      if (!el) return;
      if (!b) { el.textContent = '版本信息不可用'; return; }
      const esc = s => String(s ?? '').replace(/[&<>"']/g,
        c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
      el.innerHTML =
        `版本 <span class="sha">${esc(b.sha)}</span> · ${esc(b.time)}<br>` +
        `<span class="msg" title="${esc(b.message)}">${esc(b.message)}</span>`;
    })();

    const STEP_DEFS = [
      { id: 'connect',      label: '连接设备' },
      { id: 'identify',     label: '识别芯片型号' },
      { id: 'detect_flash', label: '检测 Flash 大小' },
      { id: 'download',     label: '下载固件' },
      { id: 'erase',        label: '擦除 Flash（全片擦除）' },
      { id: 'write',        label: '写入固件' },
      { id: 'reset',        label: '复位设备' },
    ];

    let currentStepId = null;

    function renderSteps() {
      stepsEl.innerHTML = STEP_DEFS.map(s =>
        `<li id="step-${s.id}" class="step pending">
           <span class="icon">○</span>
           <span class="label">${s.label}</span>
           <span class="detail"></span>
         </li>`
      ).join('');
    }

    function setStep(id, state, detail = '') {
      const li = document.getElementById(`step-${id}`);
      if (!li) return;
      if (state === 'active') currentStepId = id;
      li.className = `step ${state}`;

      const icon = li.querySelector('.icon');
      if (state === 'pending')      icon.textContent = '○';
      else if (state === 'active')  icon.innerHTML = '<span class="spinner"></span>';
      else if (state === 'done')    icon.textContent = '✓';
      else if (state === 'error')   icon.textContent = '✗';

      li.querySelector('.detail').textContent = detail;
    }

    /**
     * 从 esptool-js 返回的原始芯片描述中，计算出固件文件名前缀。
     *
     * 映射规则（按顺序判断）：
     *  - ESP8266      → "ESP8266"（特殊标记，由调用方弹窗选择标准版 / SD 版）
     *  - S3-PICO      → "esp32-s3"
     *  - 其他 PICO    → "esp32-old"
     *  - 纯 ESP32     → "esp32-old"
     *  - ESP32-XXXX   → "esp32-xxxx"
     *  - ESP32XXXX    → "esp32-xxxx"
     */
    function resolveFirmwarePrefix(rawChipName) {
      const raw = (rawChipName || '').trim();
      if (!raw) return '';

      if (/ESP8266/i.test(raw)) return 'ESP8266';

      if (/S3[-_ ]?PICO/i.test(raw)) return 'esp32-s3';
      if (/PICO/i.test(raw)) return 'esp32-old';
      if (/^ESP32$/i.test(raw)) return 'esp32-old';

      const hyphenMatch = raw.match(/ESP32-[A-Z0-9]+/i);
      if (hyphenMatch) return hyphenMatch[0].toLowerCase();

      const compactMatch = raw.match(/ESP32([A-Z0-9]+)/i);
      if (compactMatch) return `esp32-${compactMatch[1].toLowerCase()}`;

      return '';
    }

    /**
     * 根据检测到的 Flash 大小，生成从大到小的固件候选列表。
     * 规则：只降档，不升档。
     */
    function buildFlashCandidates(detectedFlashSize) {
      const match = String(detectedFlashSize || '').match(/(\d+)\s*MB/i);
      const detectedMB = match ? parseInt(match[1], 10) : 4;

      const STANDARD = [64, 32, 16, 8, 4, 2];
      const smaller = STANDARD.filter(s => s < detectedMB);
      const list = [detectedMB, ...smaller];

      return [...new Set(list)].map(s => `${s}mb`);
    }

    /**
     * ESP8266 弹窗，返回 "normal" / "sd"；用户取消则 reject。
     */
    function choose8266Variant() {
      return new Promise((resolve, reject) => {
        const modal = document.getElementById('modal-8266');
        modal.style.display = 'flex';

        const btnNormal = document.getElementById('btn-8266-normal');
        const btnSd     = document.getElementById('btn-8266-sd');
        const btnCancel = document.getElementById('btn-8266-cancel');

        const cleanup = () => {
          modal.style.display = 'none';
          btnNormal.onclick = null;
          btnSd.onclick = null;
          btnCancel.onclick = null;
        };
        const done = (val) => {
          cleanup();
          if (val) resolve(val);
          else reject(new Error('user cancelled variant selection'));
        };

        btnNormal.onclick = () => done('normal');
        btnSd.onclick     = () => done('sd');
        btnCancel.onclick = () => done(null);
      });
    }

    async function doFlash() {
      if (!('serial' in navigator) && !window.WebSerialPolyfill) {
        alert('当前浏览器不支持 Web Serial API，请使用桌面版 Chrome / Edge / Opera。');
        return;
      }
      if (!window.isSecureContext) {
        alert('请在 HTTPS 或 localhost 环境下使用本页面。');
        return;
      }

      flashBtn.disabled = true;
      flashBtn.textContent = '烧录中，请勿断开...';
      statusPanel.style.display = 'block';
      resultEl.textContent = '';
      progressWrap.style.display = 'none';
      progressFill.style.width = '0%';
      progressText.textContent = '0%';
      currentStepId = null;
      renderSteps();

      let loader = null;
      let transport = null;
      let firmwarePrefix = '';
      let detectedFlashTag = '';
      let usedFlashTag = '';
      let downgraded = false;

      try {
        // 1. 连接
        setStep('connect', 'active');
        const SerialPolyfill = window.WebSerialPolyfill;
        const port = SerialPolyfill && SerialPolyfill.requestPort
          ? await SerialPolyfill.requestPort()
          : await navigator.serial.requestPort();
        transport = new Transport(port, true);
        loader = new ESPLoader({ transport, baudrate: 921600 });
        await loader.main();
        setStep('connect', 'done');

        // 2. 识别芯片 → 计算固件前缀
        setStep('identify', 'active');
        const rawChipName = loader.chip?.CHIP_NAME || loader.chipName || '';
        firmwarePrefix = resolveFirmwarePrefix(rawChipName);

        if (firmwarePrefix === 'ESP8266') {
          const variant = await choose8266Variant();
          firmwarePrefix = variant === 'sd' ? '8266-sd' : '8266-8266';
          setStep('identify', 'done', 'ESP8266 → ' + (variant === 'sd' ? 'SD 版' : '标准版'));
        } else {
          if (!firmwarePrefix) {
            throw new Error(`无法识别芯片型号（原始返回: "${rawChipName}"）`);
          }
          setStep('identify', 'done', rawChipName || firmwarePrefix);
        }

        // 3. 检测 Flash 大小
        setStep('detect_flash', 'active');
        let flashSize = await loader.detectFlashSize();
        if (!flashSize) {
          console.warn('Flash 大小检测失败，回退到 4MB');
          flashSize = '4MB';
        }
        detectedFlashTag = flashSize.toLowerCase().replace(/\s+/g, '');
        setStep('detect_flash', 'done', flashSize);

        // 4. 下载固件（ESP8266 固定 4mb；ESP32 按 32→16→8→4 降档）
        setStep('download', 'active', '尝试匹配…');
        const candidates = firmwarePrefix.startsWith('8266')
          ? ['4mb']
          : buildFlashCandidates(flashSize);
        const tried = [];
        let firmwareData = null;

        for (const tag of candidates) {
          const fwFile = `${firmwarePrefix}-${tag}.bin`;
          const fwUrl  = `firmware/${fwFile}`;
          tried.push(tag);
          setStep('download', 'active', `尝试 ${tag}…`);
          try {
            const resp = await fetch(fwUrl, { cache: 'no-cache' });
            if (resp.ok) {
              firmwareData = new Uint8Array(await resp.arrayBuffer());
              usedFlashTag = tag;
              break;
            }
          } catch (e) {
            console.warn(`fetch ${fwUrl} 失败:`, e);
          }
        }

        if (!firmwareData) {
          throw new Error(
            `未找到可用固件。已尝试：${tried.join('、')}\n` +
            `请确认 firmware/ 目录下存在 ${firmwarePrefix}-*.bin。`
          );
        }

        downgraded = usedFlashTag !== detectedFlashTag;
        const downloadDetail = `${(firmwareData.length / 1024).toFixed(1)} KB` +
          (downgraded ? `（降档 ${detectedFlashTag} → ${usedFlashTag}）` : '');
        setStep('download', 'done', downloadDetail);

        // 5 + 6. 全片擦除 + 写入
        setStep('erase', 'active', '请稍候…');
        let writeStarted = false;

        await loader.writeFlash({
          fileArray: [{ data: firmwareData, address: 0x0 }],
          flashSize: 'keep',
          eraseAll: true,
          compress: true,
          reportProgress: (fileIndex, written, total) => {
            if (!writeStarted) {
              writeStarted = true;
              setStep('erase', 'done', '擦除完成');
              currentStepId = 'write';
              progressWrap.style.display = 'block';
            }
            const percent = Math.min(100, Math.round((written / total) * 100));
            progressFill.style.width = percent + '%';
            progressText.textContent = percent + '%';
            setStep('write', 'active', percent + '%');
          },
        });

        setStep('write', 'done', '100%');

        // 7. 复位
        setStep('reset', 'active');
        try {
          await loader.after('hard_reset');
          setStep('reset', 'done');
        } catch (e) {
          console.warn('复位命令发送失败:', e);
          setStep('reset', 'done', '（请手动复位）');
        }

        const usedFile = `${firmwarePrefix}-${usedFlashTag}.bin`;
        const downgradeNote = downgraded
          ? `<br><small style="color:#4a5568;">设备 Flash 为 ${detectedFlashTag}，已降档使用较小固件。</small>`
          : '';
        resultEl.innerHTML = `<div class="success">
          ✅ 烧录完成！设备已复位，可以拔下。<br>
          <small style="color:#4a5568;">使用固件：<code>${usedFile}</code></small>${downgradeNote}
        </div>`;

      } catch (err) {
        console.error(err);
        const msg = err?.message || String(err);
        const cancelled = /No port selected|user cancelled|The user aborted|cancelled variant/i.test(msg);

        if (currentStepId) {
          setStep(currentStepId, cancelled ? 'pending' : 'error');
        }
        resultEl.innerHTML = cancelled
          ? `<div class="error">已取消。</div>`
          : `<div class="error">❌ 烧录失败：${msg.replace(/\n/g, '<br>')}</div>`;

      } finally {
        flashBtn.disabled = false;
        flashBtn.textContent = '🔌 再次烧录';
        try { if (transport) await transport.disconnect(); } catch (_) {}
      }
    }

    flashBtn.addEventListener('click', doFlash);
  </script>

  <script src="firmware/build-info.js"></script>
  <script src="firmware/chips.js"></script>
</body>
</html>
